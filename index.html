                                                                            onDragOver={(e) => { if(isAdmin){ e.preventDefault(); setDragOverTarget(targetId); } }}
                                                                            onDragLeave={(e) => { if(isAdmin){ e.preventDefault(); setDragOverTarget(null); } }}
                                                                            onDrop={(e) => {
                                                                                if(!isAdmin) return;
                                                                                e.preventDefault();
                                                                                setDragOverTarget(null);
                                                                                if (draggedReportId) {
                                                                                    handleMoveReport(draggedReportId, year, month, week);
                                                                                    setDraggedReportId(null);
                                                                                }
                                                                            }}
                                                                        >
                                                                            {/* Nút thư mục TUẦN */}
                                                                            <div className="group flex items-center justify-between font-medium text-beu-teal1 mb-1.5 cursor-pointer select-none text-xs hover:text-beu-teal3 rounded" onClick={() => toggleNode(targetId)}>
                                                                                <div className="flex items-center gap-2">
                                                                                    <i className={`ph-bold ${isExpanded(targetId, false) ? 'ph-caret-down' : 'ph-caret-right'}`}></i>
                                                                                    <i className="ph-fill ph-calendar-blank text-sm"></i>
                                                                                    <span className="uppercase tracking-wide">{week}</span>
                                                                                </div>
                                                                                <div className="flex items-center gap-1">
                                                                                    <span className="bg-beu-teal2/20 text-beu-teal3 px-2 py-0.5 rounded-md text-[10px] font-bold">{realReports.length}</span>
                                                                                    
                                                                                    {/* NÚT XÓA THƯ MỤC TUẦN */}
                                                                                    {isAdmin && (
                                                                                        <button 
                                                                                            onClick={(e) => {
                                                                                                e.stopPropagation();
                                                                                                setFolderToDelete({ level: 'week', year, month, week });
                                                                                            }}
                                                                                            className="md:opacity-0 md:group-hover:opacity-100 text-gray-300 hover:text-red-500 hover:bg-red-50 p-1 rounded transition-colors"
                                                                                            title="Xóa toàn bộ thư mục này"
                                                                                        >
                                                                                            <i className="ph-fill ph-trash"></i>
                                                                                        </button>
                                                                                    )}
                                                                                </div>
                                                                            </div>

                                                                            {isExpanded(targetId, false) && (
                                                                                <div className="pl-5 space-y-2 mt-2">
                                                                                    {realReports.length === 0 ? (
                                                                                        <div className="text-[10px] text-gray-400 italic py-1 px-2 border border-dashed border-gray-200 rounded-md bg-gray-50 text-center pointer-events-none">Thư mục trống</div>
                                                                                    ) : (
                                                                                        realReports.sort((a,b) => b.createdAt - a.createdAt).map((report) => (
                                                                                            <div 
                                                                                                key={report.id}
                                                                                                draggable={isAdmin ? "true" : "false"}
                                                                                                onDragStart={(e) => {
                                                                                                    if(!isAdmin) return;
                                                                                                    setDraggedReportId(report.id);
                                                                                                    e.dataTransfer.setData("text/plain", report.id);
                                                                                                }}
                                                                                                onDragEnd={() => isAdmin && setDraggedReportId(null)}
                                                                                                onClick={() => {
                                                                                                    if(!isProcessing) {
                                                                                                        setActiveReportId(report.id);
                                                                                                        setIsMobileMenuOpen(false); // TỰ ĐỘNG ĐÓNG MENU KHI CHỌN XONG TRÊN MOBILE
                                                                                                    }
                                                                                                }}
                                                                                                className={`p-2.5 rounded-xl border transition-all group flex justify-between items-center ${isAdmin ? 'cursor-grab active:cursor-grabbing hover:border-beu-teal2 hover:bg-gray-50' : 'cursor-pointer hover:border-beu-purple1 hover:bg-gray-50'} ${
                                                                                                    draggedReportId === report.id ? 'opacity-40 scale-95' : ''
                                                                                                } ${
                                                                                                    activeReportId === report.id 
                                                                                                    ? 'bg-beu-teal2/10 border-beu-teal1 shadow-sm relative' 
                                                                                                    : 'bg-white border-gray-200'
                                                                                                }`}
                                                                                                title={isAdmin ? "Kéo thả để di chuyển thư mục" : "Bấm để xem báo cáo"}
                                                                                            >
                                                                                                {activeReportId === report.id && <div className="absolute -left-2 top-1/2 -translate-y-1/2 w-1 h-6 bg-beu-teal1 rounded-r-md"></div>}
                                                                                                
                                                                                                <div className="flex-1 min-w-0 pr-2 pointer-events-none">
                                                                                                    <div className="font-bold text-beu-purple1 mb-1 line-clamp-1 text-[13px] leading-tight" title={report.data.departmentName}>
                                                                                                        {report.data.departmentName || "Báo Cáo Tóm Tắt"}
                                                                                                    </div>
                                                                                                    <div className="text-[11px] text-gray-500 truncate font-medium flex items-center gap-1.5">
                                                                                                        <i className="ph-fill ph-file-pdf text-red-400 text-sm"></i> {report.fileName}
                                                                                                    </div>
                                                                                                </div>

                                                                                                {/* NÚT XÓA TỪNG BÁO CÁO */}
                                                                                                {isAdmin && (
                                                                                                    <button
                                                                                                        onClick={(e) => {
                                                                                                            e.stopPropagation();
                                                                                                            setReportToDelete(report.id);
                                                                                                        }}
                                                                                                        className="text-gray-300 hover:text-red-500 p-1.5 rounded-md hover:bg-red-50 transition-colors md:opacity-0 md:group-hover:opacity-100"
                                                                                                        title="Xóa báo cáo này"
                                                                                                    >
                                                                                                        <i className="ph-fill ph-trash text-base"></i>
                                                                                                    </button>
                                                                                                )}
                                                                                            </div>
                                                                                        ))
                                                                                    )}
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    )})}
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* CỘT PHẢI: DASHBOARD CHÍNH */}
                        <div className="flex-1 bg-gray-100 relative overflow-y-auto w-full">
                            {isProcessing ? (
                                <ProcessingScreen fileName={uploadingFileName} statusText={statusText} />
                            ) : activeReport ? (
                                <DashboardScreen report={activeReport} onUpdateTitle={handleUpdateReportTitle} isAdmin={isAdmin} />
                            ) : syncStatus === 'syncing' && reports.length === 0 ? (
                                <div className="flex flex-col items-center justify-center h-full text-beu-teal1 p-8 text-center print-hidden">
                                    <div className="w-24 h-24 md:w-32 md:h-32 bg-beu-teal2/20 rounded-full flex items-center justify-center mb-6 shadow-inner text-beu-teal1"><i className="ph-fill ph-arrows-clockwise animate-spin text-5xl md:text-6xl"></i></div>
                                    <h2 className="text-xl md:text-2xl font-bold text-beu-purple1 mb-2">Đang tải dữ liệu từ Google Sheets...</h2>
                                    <p className="text-sm md:text-base text-gray-500 max-w-md">Vui lòng đợi giây lát để hệ thống cập nhật các báo cáo mới nhất của Học Viện.</p>
                                </div>
                            ) : (
                                <div className="flex flex-col items-center justify-center h-full text-gray-400 p-8 text-center print-hidden">
                                    <div className="w-24 h-24 md:w-32 md:h-32 bg-gray-200 rounded-full flex items-center justify-center mb-6 shadow-inner text-gray-400"><i className="ph-fill ph-microsoft-excel-logo text-5xl md:text-6xl"></i></div>
                                    <h2 className="text-xl md:text-2xl font-bold text-gray-500 mb-2">Hệ Sinh Thái Cloud (Google Sheets)</h2>
                                    <p className="text-sm md:text-base text-gray-400 max-w-md">Toàn bộ dữ liệu của Học Viện được bảo vệ, đồng bộ hóa tự động và quản lý tập trung thông qua Google Sheets.</p>
                                    
                                    {/* Nút mở Menu khẩn cấp nếu màn hình trống trên Mobile */}
                                    <button onClick={() => setIsMobileMenuOpen(true)} className="mt-8 md:hidden flex items-center gap-2 bg-beu-teal1 text-white px-6 py-3 rounded-full font-bold shadow-lg">
                                        <i className="ph-bold ph-folders text-xl"></i> Mở Thư Mục Báo Cáo
                                    </button>
                                </div>
                            )}
                        </div>
                        
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
