<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Báo Cáo - HỌC VIỆN ÔN NGỌC BeU</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Thêm PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    </script>

    <!-- Cấu hình màu sắc thương hiệu HỌC VIỆN ÔN NGỌC BeU -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beu: {
                            teal1: '#27bdbe', teal2: '#A2DADB', teal3: '#3F989B',
                            purple1: '#302261', purple2: '#5B378F', purple3: '#7b5aa6',
                        }
                    },
                    fontFamily: { sans: ['Gotham', 'Arial', 'sans-serif'], }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Arial', sans-serif; background-color: #f3f4f6; overflow: hidden; }
        
        .ai-loader {
            width: 80px; height: 80px; border-radius: 50%;
            background: conic-gradient(from 0deg, #27bdbe, #5B378F, #27bdbe);
            animation: spin 2s linear infinite; display: flex; align-items: center; justify-content: center;
        }
        .ai-loader::after { content: ""; width: 64px; height: 64px; background-color: #f9fafb; border-radius: 50%; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .donut-chart { width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .donut-inner { width: 100px; height: 100px; background-color: white; border-radius: 50%; text-align: center; padding: 10px; }
        .progress-bar { transition: width 1s ease-in-out; }
        
        /* Hiệu ứng sọc chạy cho KPI vượt mức 100% */
        @keyframes progress-stripes {
            from { background-position: 1rem 0; }
            to { background-position: 0 0; }
        }
        .animate-stripes { animation: progress-stripes 1s linear infinite; }
        .bg-stripes {
            background-image: linear-gradient(45deg, rgba(255,255,255,0.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.25) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            body, html, #root { overflow: visible !important; height: auto !important; background-color: white !important; }
            .h-screen { height: auto !important; display: block !important; }
            .overflow-hidden, .overflow-y-auto { overflow: visible !important; }
            .flex-1 { display: block !important; height: auto !important; overflow: visible !important; }
            .print-hidden { display: none !important; }
            .print-full { width: 100% !important; margin: 0 !important; padding: 0 !important; border: none !important; }
            .shadow-sm, .shadow { box-shadow: none !important; border: 1px solid #e5e7eb !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CẤU HÌNH API GEMINI ---
        const apiKey = ""; 

        const parseWithGemini = async (text) => {
            const schema = {
                type: "OBJECT",
                properties: {
                    departmentName: { type: "STRING" },
                    reportPeriod: { type: "STRING" },
                    author: { type: "STRING" },
                    keyMetrics: {
                        type: "ARRAY", items: {
                            type: "OBJECT", properties: { 
                                label: { type: "STRING" }, value: { type: "STRING" }, note: { type: "STRING" },
                                detailedAnalysis: { type: "STRING" }, iconType: { type: "STRING" }
                            }
                        }
                    },
                    charts: {
                        type: "ARRAY", items: {
                            type: "OBJECT", properties: { 
                                title: { type: "STRING" }, insight: { type: "STRING" },
                                dataPoints: { type: "ARRAY", items: { type: "OBJECT", properties: { name: { type: "STRING" }, value: { type: "NUMBER" } } } }
                            }
                        }
                    },
                    kpiList: { type: "ARRAY", items: { type: "OBJECT", properties: { name: { type: "STRING" }, progress: { type: "NUMBER" } } } },
                    issues: { type: "ARRAY", items: { type: "OBJECT", properties: { problem: { type: "STRING" }, solution: { type: "STRING" }, detailedReason: { type: "STRING" } } } },
                    nextWeekPlans: { type: "ARRAY", items: { type: "STRING" } }
                },
                required: ["departmentName", "keyMetrics", "charts", "kpiList", "issues", "nextWeekPlans"]
            };

            const payload = {
                contents: [{ parts: [{ text: "Nhiệm vụ: Trích xuất TOÀN BỘ dữ liệu từ báo cáo.\n\nYÊU CẦU ĐẶC BIỆT (CHỐNG TRÙNG LẶP CHÉO):\n1. QUÉT SÂU & ĐẦY ĐỦ: Bóc tách TẤT CẢ các chỉ số chi tiết có trong file.\n2. PHÂN LOẠI RẠCH RÒI:\n   - 'keyMetrics': CHỈ lấy con số Tuyệt Đối (Số lượng, Số tiền, Lượt...). TUYỆT ĐỐI KHÔNG chứa số Phần trăm (%).\n   - 'kpiList': CHỈ lấy số Phần trăm (%) hoặc Tiến độ.\n   - 'charts': CHỈ TẠO BIỂU ĐỒ KHI CÓ TỪ 2 THÀNH PHẦN TRỞ LÊN TỔNG = 100% (Ví dụ: Cơ cấu doanh thu cơ sở A 40%, B 60%). NẾU LÀ CÁC TỶ LỆ ĐƠN LẺ RỜI RẠC (như Tỷ lệ chuyên cần) thì KHÔNG được tạo chart.\n3. KHÔNG TRÙNG LẶP: Một dữ liệu đã xếp vào 'kpiList' thì cấm xuất hiện ở 'keyMetrics' hay 'charts'.\n\nNội dung file:\n\n" + text.substring(0, 15000) }] }],
                systemInstruction: { parts: [{ text: `Bạn là AI Data Analyst xuất sắc của HỌC VIỆN ÔN NGỌC BeU.
QUY TẮC BẮT BUỘC:
1. Viết hoa chuẩn xác: "Học Viện", "Học Viên", "Giáo Vụ", "Trợ Giảng", "Giáo Viên", "HỌC VIỆN ÔN NGỌC BeU".
2. Nguyên tắc phân loại ĐỘC QUYỀN (Mutually Exclusive):
   - 'keyMetrics': CHỈ TÍNH SỐ LƯỢNG TUYỆT ĐỐI. KHÔNG lấy số %.
   - 'kpiList': CHỈ TÍNH TỶ LỆ PHẦN TRĂM (%). 
   - 'charts': CHỈ VẼ CƠ CẤU THÀNH PHẦN (TỔNG = 100%). CẤM gộp các tỷ lệ % không liên quan (như chuyên cần, BTVN) vào chung 1 biểu đồ.
3. Tuyệt đối không lặp lại 1 chỉ số ở 2 danh mục khác nhau.` }] },
                generationConfig: { responseMimeType: "application/json", responseSchema: schema }
            };

            let retries = 5; let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    return JSON.parse(result.candidates[0].content.parts[0].text);
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, delay)); delay *= 2;
                }
            }
        };

        // --- COMPONENTS GIAO DIỆN ---

        const Header = ({ syncStatus, onOpenSyncModal, role, setRole, onRefresh, onToggleMenu }) => {
            const isAdmin = role === 'ADMIN';

            return (
                <header className="bg-white shadow-sm px-3 md:px-6 py-3 flex flex-wrap justify-between items-center border-b-4 border-beu-teal1 shrink-0 z-10 print-hidden gap-y-3">
                    <div className="flex items-center gap-2 md:gap-3">
                        {/* Nút mở Menu trên Mobile */}
                        <button onClick={onToggleMenu} className="md:hidden text-beu-purple1 text-2xl p-1 focus:outline-none bg-gray-100 rounded-md">
                            <i className="ph-bold ph-list"></i>
                        </button>
                        
                        <img src="logo.png" alt="Logo HỌC VIỆN ÔN NGỌC BeU" className="h-8 md:h-10 w-auto object-contain" />
                        <div>
                            <div className="flex items-center gap-2 flex-wrap">
                                <h1 className="text-base md:text-xl font-bold text-beu-purple1 tracking-wide line-clamp-1">HỌC VIỆN ÔN NGỌC BeU</h1>
                                {/* Status hiện ngay dưới tên trên màn nhỏ, hoặc kế bên trên màn to */}
                                {syncStatus === 'synced' && <span className="flex items-center gap-1 text-[10px] md:text-xs text-green-600 bg-green-50 px-1.5 md:px-2 py-0.5 rounded-full whitespace-nowrap"><i className="ph-fill ph-check-circle"></i> Đã đồng bộ</span>}
                                {syncStatus === 'syncing' && <span className="flex items-center gap-1 text-[10px] md:text-xs text-blue-600 bg-blue-50 px-1.5 md:px-2 py-0.5 rounded-full whitespace-nowrap"><i className="ph-fill ph-spinner animate-spin"></i> Đang tải...</span>}
                                {syncStatus === 'error' && <span className="flex items-center gap-1 text-[10px] md:text-xs text-red-600 bg-red-50 px-1.5 md:px-2 py-0.5 rounded-full whitespace-nowrap"><i className="ph-fill ph-warning"></i> Ngoại tuyến</span>}
                            </div>
                            <p className="text-xs md:text-sm text-gray-500 hidden sm:block">
                                Hệ thống AI Phân tích Báo cáo Đa Phòng Ban
                            </p>
                        </div>
                    </div>
                    <div className="flex items-center gap-2 md:gap-4 ml-auto">
                        {isAdmin ? (
                            <button onClick={onOpenSyncModal} className="flex items-center gap-1 md:gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-300 px-3 md:px-4 py-1.5 md:py-2 rounded-full font-bold transition-colors shadow-sm text-xs md:text-sm" title="Cấu hình Link kết nối Google Sheets">
                                <i className="ph-bold ph-gear text-base md:text-lg"></i> <span className="hidden md:inline">Cấu hình DB</span>
                            </button>
                        ) : (
                            <button onClick={onRefresh} className="flex items-center gap-1 md:gap-2 bg-blue-600 hover:bg-blue-700 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-full font-bold transition-colors shadow-sm text-xs md:text-sm" title="Tải dữ liệu mới nhất từ Cloud">
                                <i className="ph-bold ph-arrows-clockwise text-base md:text-lg"></i> <span className="hidden md:inline">Làm mới</span>
                            </button>
                        )}
                        
                        <div className={`flex items-center gap-1 md:gap-2 px-2 md:px-3 py-1 md:py-1.5 rounded-full border ${isAdmin ? 'bg-beu-teal2/10 border-beu-teal2/30' : 'bg-purple-50 border-purple-200'}`}>
                            <i className={`ph-fill ${isAdmin ? 'ph-user-circle text-beu-teal1' : 'ph-users-three text-beu-purple2'} text-xl md:text-2xl`}></i>
                            <select 
                                value={role} 
                                onChange={(e) => {
                                    setRole(e.target.value);
                                    localStorage.setItem('beu_role', e.target.value);
                                }} 
                                className={`bg-transparent text-xs md:text-sm font-bold outline-none cursor-pointer appearance-none ${isAdmin ? 'text-beu-purple1' : 'text-beu-purple2'}`}
                            >
                                <option value="VIEWER">Ban Giám Đốc</option>
                                <option value="ADMIN">Admin Yên</option>
                            </select>
                            <i className={`ph-bold ph-caret-down text-[10px] md:text-xs ml-0.5 md:ml-1 ${isAdmin ? 'text-beu-teal1' : 'text-beu-purple2'}`}></i>
                        </div>
                    </div>
                </header>
            );
        };

        const CompactUploadScreen = ({ onUpload, disabled }) => {
            const [isDragging, setIsDragging] = useState(false);
            const handleDrop = (e) => {
                e.preventDefault(); setIsDragging(false);
                if (!disabled && e.dataTransfer.files[0]) onUpload(e.dataTransfer.files[0]);
            }

            return (
                <div 
                    onDragOver={e => { e.preventDefault(); setIsDragging(true); }} 
                    onDragLeave={() => setIsDragging(false)} 
                    onDrop={handleDrop}
                    className={`w-full p-4 border-2 border-dashed rounded-xl flex flex-col items-center justify-center transition-all duration-300 text-center
                        ${disabled ? 'opacity-50 cursor-not-allowed bg-gray-100 border-gray-300' : isDragging ? 'border-beu-teal1 bg-beu-teal2/20 scale-105' : 'border-gray-300 bg-white hover:border-beu-teal1 hover:bg-gray-50 cursor-pointer'}`}
                    onClick={() => !disabled && document.getElementById('file-upload').click()}
                >
                    <i className={`ph-fill ph-upload-simple text-3xl mb-1 ${isDragging ? 'text-beu-teal1' : 'text-gray-400'}`}></i>
                    <h3 className="text-sm font-bold text-beu-purple1">Thả file PDF Báo cáo mới</h3>
                    <input id="file-upload" type="file" accept=".pdf,.txt" className="hidden" onChange={(e) => { if(e.target.files[0]) onUpload(e.target.files[0]) }} disabled={disabled} />
                </div>
            );
        };

        const SheetsConfigModal = ({ onClose, apiUrl, setApiUrl, onSync, disabled }) => {
            const [inputUrl, setInputUrl] = useState(apiUrl || "");
            
            const handleSubmit = (e) => {
                e.preventDefault();
                setApiUrl(inputUrl);
                onSync(inputUrl);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-beu-purple1/60 backdrop-blur-sm print-hidden">
                    <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col">
                        <div className="px-5 py-4 border-b bg-green-50 flex justify-between items-center">
                            <h3 className="font-bold text-green-800 flex items-center gap-2"><i className="ph-fill ph-microsoft-excel-logo text-xl"></i> Cấu hình Google Sheets</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-red-500"><i className="ph ph-x text-xl"></i></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-5 space-y-4">
                            <p className="text-sm text-gray-600">Dán API Link (Web App URL) của Google Sheets vào đây để lưu và đồng bộ tự động dữ liệu của Học Viện.</p>
                            <input 
                                type="password" 
                                placeholder="https://script.google.com/macros/s/..." 
                                className="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500"
                                value={inputUrl}
                                onChange={(e) => setInputUrl(e.target.value)}
                                disabled={disabled}
                            />
                            <div className="flex justify-end gap-3 pt-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm font-medium transition-colors">Hủy</button>
                                <button type="submit" disabled={disabled || !inputUrl.trim()} className={`px-4 py-2 rounded-lg font-bold text-sm text-white transition-colors shadow-sm ${disabled || !inputUrl.trim() ? 'bg-gray-300 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700'}`}>
                                    Lưu & Đồng bộ ngay
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const FolderCreateModal = ({ onClose, onCreate }) => {
            const [year, setYear] = useState(new Date().getFullYear().toString());
            const [month, setMonth] = useState((new Date().getMonth() + 1).toString());
            const [week, setWeek] = useState("1");

            const onSubmit = (e) => {
                e.preventDefault();
                onCreate(`Tuần ${week} - Tháng ${month.padStart(2, '0')}/${year}`, year, month, week);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-beu-purple1/60 backdrop-blur-sm print-hidden">
                    <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden flex flex-col scale-100 transition-transform">
                        <div className="px-5 py-4 border-b bg-gray-50 flex justify-between items-center">
                            <h3 className="font-bold text-beu-purple1 flex items-center gap-2"><i className="ph-bold ph-folder-plus text-beu-teal1 text-xl"></i> Thêm Thư Mục Mới</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-red-500"><i className="ph ph-x text-xl"></i></button>
                        </div>
                        <form onSubmit={onSubmit} className="p-5 space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-1">Năm</label>
                                    <input type="number" value={year} onChange={e=>setYear(e.target.value)} className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-beu-teal1 focus:outline-none" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-1">Tháng</label>
                                    <input type="number" min="1" max="12" value={month} onChange={e=>setMonth(e.target.value)} className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-beu-teal1 focus:outline-none" required />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">Tên Tuần (Phân loại)</label>
                                <div className="flex items-center gap-2">
                                    <span className="bg-gray-100 px-3 py-2 rounded-lg text-sm text-gray-600 font-medium border">Tuần</span>
                                    <input type="number" min="1" max="53" value={week} onChange={e=>setWeek(e.target.value)} className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-beu-teal1 focus:outline-none" required placeholder="Ví dụ: 3" />
                                </div>
                            </div>
                            <div className="pt-2">
                                <button type="submit" className="w-full bg-beu-teal1 hover:bg-beu-teal3 text-white font-bold py-2.5 rounded-lg transition-colors">Khởi tạo Thư Mục</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const ProcessingScreen = ({ fileName, statusText }) => (
            <div className="flex flex-col items-center justify-center h-full bg-gray-50/50 print-hidden p-4">
                <div className="ai-loader mb-8 shadow-lg"></div>
                <h2 className="text-xl md:text-2xl font-bold text-beu-purple1 mb-2 text-center">Hệ thống đang xử lý...</h2>
                <p className="text-sm md:text-base text-gray-600 text-center max-w-md truncate w-full px-4"><span className="font-semibold text-beu-teal1">{fileName}</span></p>
                <div className="mt-8 w-48 md:w-64 bg-gray-200 rounded-full h-2 overflow-hidden shadow-inner"><div className="bg-beu-purple1 h-2 rounded-full animate-[pulse_1s_ease-in-out_infinite]" style={{ width: '100%' }}></div></div>
                <div className="mt-6 px-4 py-2 bg-white text-beu-teal3 rounded-lg font-medium flex items-center gap-2 border border-beu-teal2 shadow-sm text-sm"><i className="ph-fill ph-spinner-gap animate-spin text-lg md:text-xl"></i> {statusText}</div>
            </div>
        );

        const DashboardScreen = ({ report, onUpdateTitle, isAdmin }) => {
            const data = report.data;
            const [activeDetail, setActiveDetail] = useState(null);
            const [isEditingTitle, setIsEditingTitle] = useState(false);
            const [tempTitle, setTempTitle] = useState("");
            const colors = ['#27bdbe', '#5B378F', '#A2DADB', '#302261', '#3F989B', '#7b5aa6'];
            
            useEffect(() => {
                setTempTitle(report.data.departmentName || "TỔNG HỢP");
                setIsEditingTitle(false);
            }, [report]);

            const handleSaveTitle = () => {
                setIsEditingTitle(false);
                if (tempTitle.trim() !== report.data.departmentName && onUpdateTitle) {
                    onUpdateTitle(report.id, tempTitle.trim() || "TỔNG HỢP");
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') handleSaveTitle();
                if (e.key === 'Escape') {
                    setTempTitle(report.data.departmentName || "TỔNG HỢP");
                    setIsEditingTitle(false);
                }
            };

            const generateGradient = (items) => {
                if (!items || items.length === 0) return 'conic-gradient(#e5e7eb 0% 100%)';
                let current = 0; const total = items.reduce((sum, item) => sum + (item.value || 0), 0) || 100;
                const parts = items.map((item, idx) => {
                    const percentage = ((item.value || 0) / total) * 100;
                    const start = current; const end = current + percentage; current = end;
                    return `${colors[idx % colors.length]} ${start}% ${end}%`;
                });
                return `conic-gradient(${parts.join(', ')})`;
            };

            const getIconInfo = (type, index) => {
                const iconMap = {
                    'money': { icon: 'ph-coins', bg: 'bg-beu-teal2/20', text: 'text-beu-teal1', border: 'border-beu-teal1' },
                    'users': { icon: 'ph-users-three', bg: 'bg-purple-100', text: 'text-beu-purple2', border: 'border-beu-purple3' },
                    'percent': { icon: 'ph-target', bg: 'bg-beu-teal3/20', text: 'text-beu-teal3', border: 'border-beu-teal3' },
                    'chart': { icon: 'ph-trend-up', bg: 'bg-blue-100', text: 'text-blue-600', border: 'border-blue-500' },
                    'target': { icon: 'ph-bullseye', bg: 'bg-orange-100', text: 'text-orange-500', border: 'border-orange-400' },
                    'document': { icon: 'ph-file-text', bg: 'bg-gray-100', text: 'text-gray-600', border: 'border-gray-400' }
                };
                const defaultStyles = [{ icon: 'ph-chart-bar', bg: 'bg-beu-teal2/20', text: 'text-beu-teal1', border: 'border-beu-teal1' }];
                return iconMap[type] || defaultStyles[index % defaultStyles.length];
            };

            const handlePrintPDF = () => { window.print(); };

            const DetailModal = () => {
                if (!activeDetail) return null;
                return (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-6 bg-beu-purple1/60 backdrop-blur-sm transition-opacity print-hidden" onClick={() => setActiveDetail(null)}>
                        <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                            <div className="px-4 md:px-6 py-3 md:py-4 border-b flex justify-between items-center bg-gray-50 shrink-0">
                                <h3 className="text-lg md:text-xl font-bold text-beu-purple1 flex items-center gap-2 line-clamp-1"><i className="ph-fill ph-info text-beu-teal1"></i> Chi Tiết: {activeDetail.title}</h3>
                                <button onClick={() => setActiveDetail(null)} className="text-gray-400 hover:text-red-500 ml-2 shrink-0"><i className="ph ph-x text-2xl"></i></button>
                            </div>
                            <div className="p-4 md:p-6 overflow-y-auto">
                                {activeDetail.type === 'metric' && (
                                    <div className="space-y-4">
                                        <div className="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4 mb-4">
                                            <div className={`p-4 w-fit ${activeDetail.iconInfo.bg} rounded-xl ${activeDetail.iconInfo.text}`}><i className={`ph-fill ${activeDetail.iconInfo.icon} text-3xl md:text-4xl`}></i></div>
                                            <div><div className="text-3xl md:text-4xl font-black text-beu-purple1">{activeDetail.value}</div><div className="text-gray-500 text-sm md:text-lg">{activeDetail.note}</div></div>
                                        </div>
                                        <div className="bg-beu-teal2/10 p-4 md:p-5 rounded-xl border border-beu-teal2/30">
                                            <h4 className="font-bold text-beu-teal3 mb-2 md:mb-3 flex items-center gap-2 text-sm md:text-base"><i className="ph ph-sparkle"></i> AI Phân Tích Đánh Giá:</h4>
                                            <p className="text-gray-800 leading-relaxed text-justify text-sm md:text-base">{activeDetail.detailedAnalysis || "Không có phân tích."}</p>
                                        </div>
                                    </div>
                                )}
                                {activeDetail.type === 'chart' && (
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4">
                                            {activeDetail.dataPoints && activeDetail.dataPoints.map((dp, idx) => {
                                                let displayStr = dp.value.toLocaleString('vi-VN');
                                                return (
                                                <div key={idx} className="flex justify-between items-center bg-white p-3 rounded-lg border shadow-sm">
                                                    <span className="flex items-center gap-2 font-medium text-gray-700">
                                                        <span className="w-3 h-3 md:w-4 md:h-4 rounded-full shrink-0" style={{ backgroundColor: colors[idx % colors.length] }}></span>
                                                        <span className="line-clamp-2 text-xs md:text-sm">{dp.name}</span>
                                                    </span>
                                                    <span className="font-bold text-beu-purple1 whitespace-nowrap ml-2 text-sm md:text-base">{displayStr}</span>
                                                </div>
                                            )})}
                                        </div>
                                        <div className="bg-purple-50 p-4 md:p-5 rounded-xl border border-purple-100 mt-4"><h4 className="font-bold text-beu-purple2 mb-2 md:mb-3 flex items-center gap-2 text-sm md:text-base"><i className="ph ph-lightbulb"></i> Nhận Xét:</h4><p className="text-gray-800 leading-relaxed text-justify text-sm md:text-base">{activeDetail.insight || "Chưa có nhận xét."}</p></div>
                                    </div>
                                )}
                                {activeDetail.type === 'kpi' && (
                                    <div className="space-y-4 md:space-y-5">
                                        {activeDetail.items && activeDetail.items.map((kpi, idx) => {
                                            const isOver = kpi.progress > 100;
                                            const displayWidth = Math.min(kpi.progress, 100);
                                            return (
                                            <div key={idx} className={`bg-white p-3 md:p-4 rounded-xl border shadow-sm transition-all ${isOver ? 'border-beu-teal2 bg-beu-teal2/5 shadow-beu-teal2/20' : ''}`}>
                                                <div className="flex justify-between items-end text-sm md:text-base mb-2">
                                                    <span className="font-bold text-gray-800 flex items-center gap-2">
                                                        {kpi.name}
                                                        {isOver && <span className="text-[9px] md:text-[10px] bg-beu-teal1 text-white px-2 py-0.5 rounded-full uppercase tracking-wider font-bold shadow-sm animate-pulse"><i className="ph-fill ph-rocket-launch"></i> Vượt KPI</span>}
                                                    </span>
                                                    <span className={`font-black ${isOver ? 'text-beu-teal1 text-base md:text-lg' : 'text-beu-purple1'}`}>{kpi.progress}%</span>
                                                </div>
                                                <div className="w-full bg-gray-200 rounded-full h-2 md:h-3 overflow-hidden relative shadow-inner">
                                                    <div className="h-2 md:h-3 rounded-full progress-bar absolute top-0 left-0" style={{ width: `${displayWidth}%`, backgroundColor: colors[idx % colors.length] }}></div>
                                                    {isOver && (
                                                        <div className="h-2 md:h-3 rounded-full absolute top-0 left-0 w-full bg-stripes animate-stripes"></div>
                                                    )}
                                                </div>
                                            </div>
                                        )})}
                                    </div>
                                )}
                                {activeDetail.type === 'issues' && (
                                    <div className="space-y-3 md:space-y-4">
                                        {activeDetail.items && activeDetail.items.map((issue, idx) => (
                                            <div key={idx} className="bg-orange-50 p-3 md:p-4 rounded-xl border border-orange-200">
                                                <p className="font-bold text-orange-700 text-base md:text-lg mb-2 flex items-center gap-2"><i className="ph-fill ph-warning shrink-0"></i> <span>{issue.problem}</span></p>
                                                {issue.detailedReason && <div className="text-gray-600 mb-2 md:mb-3 text-xs md:text-sm bg-white p-2 md:p-3 rounded-lg shadow-sm"><strong className="text-orange-600 block">Nguyên nhân:</strong> {issue.detailedReason}</div>}
                                                <div className="text-gray-800 bg-white p-2 md:p-3 rounded-lg shadow-sm border border-orange-100 text-sm md:text-base"><strong className="text-beu-teal1 block">Giải pháp:</strong> {issue.solution}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {activeDetail.type === 'plans' && (
                                    <div className="space-y-2 md:space-y-3">
                                        {activeDetail.items && activeDetail.items.map((plan, idx) => (
                                            <div key={idx} className="flex items-start gap-2 md:gap-3 bg-white p-3 md:p-4 rounded-xl border border-beu-teal2"><i className="ph-fill ph-check-circle text-beu-teal1 text-xl md:text-2xl shrink-0 mt-0.5"></i><span className="text-sm md:text-base text-gray-700">{plan}</span></div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-4 md:space-y-6 relative h-full print-full">
                    <DetailModal />
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-3 md:gap-4 border-b border-gray-200 pb-3 md:pb-4 mb-4 md:mb-6">
                        <div className="flex-1 pr-0 md:pr-4">
                            {isEditingTitle && isAdmin ? (
                                <div className="flex flex-wrap items-center text-xl md:text-3xl font-bold text-beu-purple1 uppercase tracking-tight w-full mb-1">
                                    <span className="shrink-0">BÁO CÁO:&nbsp;</span>
                                    <input 
                                        type="text"
                                        className="border-b-2 border-beu-teal1 focus:outline-none bg-blue-50/50 px-2 py-1 rounded-t w-full max-w-xl text-lg md:text-3xl"
                                        value={tempTitle}
                                        onChange={(e) => setTempTitle(e.target.value)}
                                        onBlur={handleSaveTitle}
                                        onKeyDown={handleKeyDown}
                                        autoFocus
                                    />
                                </div>
                            ) : (
                                <h2 
                                    className={`text-xl md:text-3xl font-bold text-beu-purple1 uppercase tracking-tight flex items-center gap-2 md:gap-3 w-fit mb-1 ${isAdmin ? 'cursor-pointer group' : ''}`}
                                    onClick={() => isAdmin && setIsEditingTitle(true)}
                                    title={isAdmin ? "Bấm để chỉnh sửa tên báo cáo" : ""}
                                >
                                    <span className="line-clamp-2 leading-tight">BÁO CÁO: {data.departmentName || "TỔNG HỢP"}</span>
                                    {isAdmin && (
                                        <button className="text-gray-300 group-hover:text-beu-teal1 transition-colors print-hidden shrink-0 mt-1">
                                            <i className="ph-fill ph-pencil-simple text-lg md:text-xl"></i>
                                        </button>
                                    )}
                                </h2>
                            )}
                            <p className="text-sm md:text-base text-gray-600 font-medium mt-1">Kỳ báo cáo: <span className="text-beu-teal1">{data.reportPeriod || "N/A"}</span> <span className="hidden md:inline">{data.author ? `| Người lập: ${data.author}` : ''}</span></p>
                            {/* Hiện thêm dòng người lập riêng cho Mobile */}
                            {data.author && <p className="text-xs text-gray-500 md:hidden mt-0.5">Người lập: {data.author}</p>}
                        </div>
                        <div className="flex gap-2 md:gap-3 print-hidden shrink-0 w-full sm:w-auto mt-2 sm:mt-0">
                            <button onClick={handlePrintPDF} className="w-full sm:w-auto justify-center flex items-center gap-2 bg-beu-purple1 hover:bg-beu-purple2 text-white px-3 md:px-4 py-2 rounded-lg font-bold transition-colors shadow-md text-sm md:text-base" title="Lưu thành file PDF để báo cáo">
                                <i className="ph-bold ph-printer"></i> In / Lưu PDF
                            </button>
                        </div>
                    </div>

                    {data.keyMetrics && data.keyMetrics.length > 0 && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                            {data.keyMetrics.map((metric, idx) => {
                                const style = getIconInfo(metric.iconType, idx);
                                return (
                                    <div key={idx} onClick={() => setActiveDetail({ ...metric, type: 'metric', iconInfo: style, title: metric.label })} className={`bg-white rounded-xl p-4 md:p-6 border-l-4 ${style.border} shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer group`}>
                                        <div className="flex justify-between items-start">
                                            <div><p className="text-xs md:text-sm text-gray-500 font-bold mb-1 uppercase line-clamp-1 pr-2">{metric.label}</p><h3 className="text-xl md:text-2xl font-bold text-beu-purple1">{metric.value}</h3></div>
                                            <div className={`p-2.5 md:p-3 ${style.bg} rounded-lg ${style.text} shrink-0`}><i className={`ph-fill ${style.icon} text-xl md:text-2xl`}></i></div>
                                        </div>
                                        <div className="mt-3 md:mt-4 text-xs md:text-sm text-gray-600 line-clamp-2">{metric.note}</div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
                        {data.charts && data.charts.length > 0 && (
                            <div className="bg-white rounded-xl p-4 md:p-6 shadow-sm border border-gray-100 overflow-hidden">
                                <h3 className="text-base md:text-lg font-bold text-beu-purple1 mb-4 md:mb-6 border-b pb-2">Phân Tích Dữ Liệu</h3>
                                <div className="flex flex-col sm:flex-row sm:flex-wrap justify-around gap-4 md:gap-6">
                                    {data.charts.map((chart, cIdx) => {
                                        return (
                                        <div key={cIdx} onClick={() => setActiveDetail({ ...chart, type: 'chart' })} className="flex flex-col items-center w-full sm:w-[calc(50%-1rem)] lg:flex-1 p-3 md:p-4 rounded-xl hover:bg-gray-50 hover:shadow-inner cursor-pointer border border-transparent hover:border-gray-200 transition-all group">
                                            <h4 className="text-xs md:text-sm font-semibold text-gray-700 mb-3 md:mb-4 text-center line-clamp-2 h-8 md:h-10">{chart.title}</h4>
                                            <div className="donut-chart w-[120px] h-[120px] md:w-[150px] md:h-[150px] shadow-md shrink-0" style={{ background: generateGradient(chart.dataPoints) }}><div className="donut-inner w-[80px] h-[80px] md:w-[100px] md:h-[100px] flex flex-col items-center justify-center"><span className="text-[8px] md:text-[10px] text-gray-400 uppercase">Tỷ trọng</span></div></div>
                                            <div className="mt-3 md:mt-4 space-y-1.5 md:space-y-2 text-xs md:text-sm w-full max-w-[250px] mx-auto">
                                                {chart.dataPoints && chart.dataPoints.map((dp, idx) => {
                                                    let displayStr = dp.value.toLocaleString('vi-VN');
                                                    return (
                                                    <div key={idx} className="flex items-center gap-1.5 md:gap-2">
                                                        <span className="w-2.5 h-2.5 md:w-3 md:h-3 rounded-full shrink-0" style={{ backgroundColor: colors[idx % colors.length] }}></span>
                                                        <span className="truncate" title={`${displayStr} ${dp.name}`}><b>{displayStr}</b> {dp.name}</span>
                                                    </div>
                                                )})}
                                            </div>
                                        </div>
                                    )})}
                                </div>
                            </div>
                        )}
                        <div onClick={() => setActiveDetail({ title: 'Tiến Độ KPI', type: 'kpi', items: data.kpiList })} className={`bg-white rounded-xl p-4 md:p-6 shadow-sm hover:shadow-xl cursor-pointer border border-transparent hover:border-beu-purple1/20 transition-all group ${(!data.charts || data.charts.length === 0) ? 'lg:col-span-2' : ''}`}>
                            <div className="flex justify-between items-end mb-4 md:mb-6 border-b pb-2"><h3 className="text-base md:text-lg font-bold text-beu-purple1">Tiến Độ Hoàn Thành (KPI)</h3></div>
                            <div className="space-y-3 md:space-y-4">
                                {data.kpiList && data.kpiList.map((kpi, idx) => {
                                    const isOver = kpi.progress > 100;
                                    const displayWidth = Math.min(kpi.progress, 100);
                                    return (
                                    <div key={idx}>
                                        <div className="flex justify-between items-end text-xs md:text-sm mb-1">
                                            <span className="font-medium text-gray-700 flex items-center gap-1 line-clamp-1 pr-2">
                                                {kpi.name}
                                                {isOver && <i className="ph-fill ph-fire text-orange-500 animate-bounce shrink-0" title="Vượt chỉ tiêu!"></i>}
                                            </span>
                                            <span className={`font-bold ${isOver ? 'text-beu-teal1' : 'text-beu-purple1'} shrink-0`}>{kpi.progress}%</span>
                                        </div>
                                        <div className="w-full bg-gray-100 rounded-full h-1.5 md:h-2 shadow-inner relative overflow-hidden">
                                            <div className="h-1.5 md:h-2 rounded-full progress-bar absolute top-0 left-0" style={{ width: `${displayWidth}%`, backgroundColor: colors[idx % colors.length] }}></div>
                                            {isOver && (
                                                <div className="h-1.5 md:h-2 rounded-full absolute top-0 left-0 w-full bg-stripes animate-stripes opacity-70"></div>
                                            )}
                                        </div>
                                    </div>
                                )})}
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 pb-6 md:pb-8">
                        <div onClick={() => setActiveDetail({ title: 'Vấn Đề Tồn Đọng', type: 'issues', items: data.issues })} className="bg-white rounded-xl p-4 md:p-6 shadow-sm border-l-4 border-l-orange-400 hover:shadow-xl cursor-pointer transition-all group">
                            <h3 className="text-base md:text-lg font-bold text-orange-600 mb-3 md:mb-4 flex items-center gap-2"><i className="ph-fill ph-warning-circle"></i> Vấn Đề & Đề Xuất</h3>
                            <ul className="space-y-2 md:space-y-3">
                                {data.issues && data.issues.map((issue, idx) => (
                                    <li key={idx} className="flex gap-2 md:gap-3 bg-orange-50/50 p-2 md:p-3 rounded-lg"><div className="text-orange-600 shrink-0 mt-0.5"><i className="ph-fill ph-warning text-sm md:text-base"></i></div><div><p className="font-semibold text-gray-800 text-sm md:text-base leading-snug">{issue.problem}</p><p className="text-xs md:text-sm text-gray-600 mt-1 line-clamp-2 md:line-clamp-1">{issue.solution}</p></div></li>
                                ))}
                            </ul>
                        </div>
                        <div onClick={() => setActiveDetail({ title: 'Kế Hoạch Tiếp Theo', type: 'plans', items: data.nextWeekPlans })} className="bg-white rounded-xl p-4 md:p-6 shadow-sm border-l-4 border-l-beu-teal1 hover:shadow-xl cursor-pointer transition-all group">
                            <h3 className="text-base md:text-lg font-bold text-beu-teal3 mb-3 md:mb-4 flex items-center gap-2"><i className="ph-fill ph-calendar-check"></i> Kế Hoạch Tuần Tới</h3>
                            <ul className="space-y-2 md:space-y-3">
                                {data.nextWeekPlans && data.nextWeekPlans.map((plan, idx) => (
                                    <li key={idx} className="flex items-start gap-2 md:gap-3 text-gray-700 bg-gray-50 p-2 md:p-2.5 rounded-lg border border-gray-100"><i className="ph-fill ph-check-circle text-beu-teal1 shrink-0 mt-0.5 text-sm md:text-base"></i><span className="line-clamp-2 md:line-clamp-1 text-sm md:text-base">{plan}</span></li>
                                ))}
                            </ul>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [role, setRole] = useState(() => localStorage.getItem('beu_role') || 'VIEWER');
            const isAdmin = role === 'ADMIN';

            // TRẠNG THÁI MENU MOBILE (ĐÓNG/MỞ CÂY THƯ MỤC TRÊN ĐIỆN THOẠI)
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const [reports, setReports] = useState([]);
            const [activeReportId, setActiveReportId] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [statusText, setStatusText] = useState('');
            const [uploadingFileName, setUploadingFileName] = useState('');
            
            const [draggedReportId, setDraggedReportId] = useState(null);
            const [dragOverTarget, setDragOverTarget] = useState(null);
            const [showFolderModal, setShowFolderModal] = useState(false);
            const [showSyncModal, setShowSyncModal] = useState(false);

            const defaultApiUrl = "https://script.google.com/macros/s/AKfycbyT5_SBMZdvytnL-Tu4cT6FgFq5s_azwSBWFDRmr9MPPXE-9pW3YGVfdE0eszNW4ELb/exec";
            const [sheetsApiUrl, setSheetsApiUrl] = useState(() => {
                const saved = localStorage.getItem('beu_sheets_api');
                if (saved === "https://script.google.com/macros/s/AKfycbzIGDH5k_Sl_5Ny5Mg9uYZ_XBvIK-pMOMya4acZZJ8K1Fck5xTYLS1aybjrFsbjOqPb/exec") {
                    localStorage.setItem('beu_sheets_api', defaultApiUrl);
                    return defaultApiUrl;
                }
                return (saved && saved.trim() !== '') ? saved : defaultApiUrl;
            });
            const [syncStatus, setSyncStatus] = useState(sheetsApiUrl ? 'syncing' : 'offline');

            const saveApiUrl = (url) => {
                setSheetsApiUrl(url);
                localStorage.setItem('beu_sheets_api', url);
            };

            const getReportPath = (report) => {
                let year, month, week;
                if (report.folderPath && report.folderPath.year !== undefined && report.folderPath.year !== null) {
                    year = String(report.folderPath.year);
                    month = String(report.folderPath.month);
                    week = String(report.folderPath.week);
                } else {
                    let periodStr = (report.data?.reportPeriod || "").toLowerCase();
                    let date = new Date(report.createdAt || Date.now());
                    year = date.getFullYear().toString();
                    month = `Tháng ${String(date.getMonth() + 1).padStart(2, '0')}`;
                    week = "Báo cáo chung";

                    const yearMatch = periodStr.match(/20\d{2}/);
                    if (yearMatch) year = yearMatch[0];

                    const monthMatch = periodStr.match(/tháng\s*(\d{1,2})/);
                    if (monthMatch) month = `Tháng ${monthMatch[1].padStart(2, '0')}`;

                    const weekMatch = periodStr.match(/tuần\s*(\d{1,2})/);
                    if (weekMatch) week = `Tuần ${weekMatch[1]}`;
                }
                
                if (year === "undefined" || !year) year = new Date().getFullYear().toString();
                if (month === "undefined" || !month) month = "Tháng 01";
                if (week === "undefined" || !week) week = "Báo cáo chung";

                return { year, month, week };
            };

            const syncAllToSheets = async (reportsList) => {
                if (!sheetsApiUrl) return;
                setSyncStatus('syncing');
                try {
                    const response = await fetch(sheetsApiUrl, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'SYNC_ALL', payload: reportsList })
                    });
                    
                    const result = await response.json();
                    if (result.status === 'success') {
                        setSyncStatus('synced');
                    } else {
                        throw new Error(result.message || "Google Sheets từ chối lưu");
                    }
                } catch (error) {
                    console.error("Lỗi đồng bộ (Hãy kiểm tra lại Link API):", error);
                    setSyncStatus('error');
                }
            };

            const updateAndSyncReports = (updatedReports) => {
                setReports(updatedReports);
                localStorage.setItem('beu_reports_db', JSON.stringify(updatedReports));
                syncAllToSheets(updatedReports);
            };

            const fetchFromSheets = async (url) => {
                if (!url) return;
                setSyncStatus('syncing');
                try {
                    const fetchUrl = url + (url.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
                    const response = await fetch(fetchUrl, { cache: 'no-store' });
                    if (!response.ok) throw new Error("Link API bị lỗi.");
                    const cloudData = await response.json();
                    
                    if (Array.isArray(cloudData)) {
                        const sortedData = cloudData.sort((a, b) => b.createdAt - a.createdAt);
                        setReports(sortedData);
                        localStorage.setItem('beu_reports_db', JSON.stringify(sortedData)); 
                        setSyncStatus('synced');
                    }
                } catch (error) {
                    console.error("Lỗi kéo dữ liệu:", error);
                    setSyncStatus('error');
                    const localData = localStorage.getItem('beu_reports_db');
                    if (localData) setReports(JSON.parse(localData));
                }
            };

            useEffect(() => {
                if (sheetsApiUrl) fetchFromSheets(sheetsApiUrl);
                else {
                    const localData = localStorage.getItem('beu_reports_db');
                    if (localData) setReports(JSON.parse(localData));
                }
            }, [sheetsApiUrl]);

            useEffect(() => {
                const handleFocus = () => {
                    if (sheetsApiUrl && syncStatus !== 'syncing') fetchFromSheets(sheetsApiUrl);
                };
                window.addEventListener('focus', handleFocus);
                return () => window.removeEventListener('focus', handleFocus);
            }, [sheetsApiUrl, syncStatus]);

            const [reportToDelete, setReportToDelete] = useState(null);
            const [folderToDelete, setFolderToDelete] = useState(null);

            const confirmDeleteReport = () => {
                if (reportToDelete) {
                    const updated = reports.filter(r => r.id !== reportToDelete);
                    updateAndSyncReports(updated);
                    if (activeReportId === reportToDelete) setActiveReportId(null);
                    setReportToDelete(null);
                }
            };

            const confirmDeleteFolder = () => {
                if (folderToDelete) {
                    const { level, year, month, week } = folderToDelete;
                    const updated = reports.filter(r => {
                        const rPath = getReportPath(r);
                        if (level === 'year' && rPath.year === year) return false;
                        if (level === 'month' && rPath.year === year && rPath.month === month) return false;
                        if (level === 'week' && rPath.year === year && rPath.month === month && rPath.week === week) return false;
                        return true; 
                    });
                    
                    updateAndSyncReports(updated);
                    if (activeReportId && !updated.find(r => r.id === activeReportId)) {
                        setActiveReportId(null);
                    }
                    setFolderToDelete(null);
                }
            };

            const handleUpdateReportTitle = (id, newTitle) => {
                const updated = reports.map(r => r.id === id ? { ...r, data: { ...r.data, departmentName: newTitle } } : r);
                updateAndSyncReports(updated);
            };

            const handleMoveReport = (id, targetYear, targetMonth, targetWeek) => {
                const updated = reports.map(r => r.id === id ? { ...r, folderPath: { year: targetYear, month: targetMonth, week: targetWeek } } : r);
                updateAndSyncReports(updated);
            };

            const handleCreateFolder = async (periodStr, year, month, week) => {
                const folderPath = { year: String(year), month: `Tháng ${String(month).padStart(2, '0')}`, week: `Tuần ${String(week)}` };
                const newFolder = {
                    id: 'folder_' + Date.now().toString(),
                    fileName: "_FOLDER_",
                    timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
                    createdAt: Date.now(),
                    monthYear: folderPath.month + "/" + folderPath.year,
                    folderPath: folderPath,
                    data: {
                        departmentName: "_FOLDER_", reportPeriod: periodStr, author: "",
                        keyMetrics: [], charts: [], kpiList: [], issues: [], nextWeekPlans: []
                    }
                };

                const updated = [newFolder, ...reports].sort((a, b) => b.createdAt - a.createdAt);
                updateAndSyncReports(updated);

                setExpandedNodes(prev => ({
                    ...prev,
                    [`y-${year}`]: true,
                    [`m-${year}-${folderPath.month}`]: true,
                    [`w-${year}-${folderPath.month}-${folderPath.week}`]: true
                }));
            };

            const handleUpload = async (file) => {
                setUploadingFileName(file.name);
                setIsProcessing(true);
                
                try {
                    let textToParse = "";
                    setStatusText('Đang đọc tài liệu...');
                    if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            textToParse += content.items.map(item => item.str).join(" ") + "\n";
                        }
                    } else {
                        textToParse = await file.text();
                    }
                    
                    if(!textToParse.trim()) throw new Error("File trống hoặc là ảnh chụp.");

                    setStatusText('AI đang quét sâu và bóc tách số liệu...');
                    const parsedData = await parseWithGemini(textToParse);
                    
                    if (parsedData) {
                        if (parsedData.keyMetrics) parsedData.keyMetrics = parsedData.keyMetrics.filter((v, i, a) => a.findIndex(t => t.label?.trim().toLowerCase() === v.label?.trim().toLowerCase()) === i);
                        if (parsedData.kpiList) parsedData.kpiList = parsedData.kpiList.filter((v, i, a) => a.findIndex(t => t.name?.trim().toLowerCase() === v.name?.trim().toLowerCase()) === i);
                        if (parsedData.issues) parsedData.issues = parsedData.issues.filter((v, i, a) => a.findIndex(t => t.problem?.trim().toLowerCase() === v.problem?.trim().toLowerCase()) === i);
                        
                        if (parsedData.keyMetrics && parsedData.kpiList) {
                            let metricsToKeep = [];
                            parsedData.keyMetrics.forEach(m => {
                                if (String(m.value).includes('%') || String(m.label).toLowerCase().includes('tỷ lệ') || String(m.label).toLowerCase().includes('tỉ lệ')) {
                                    let rawStr = String(m.value).replace(/%/g, '').replace(/,/g, '.');
                                    let valNum = parseFloat(rawStr);
                                    if (!isNaN(valNum)) {
                                        parsedData.kpiList.push({ name: m.label, progress: valNum });
                                    }
                                } else {
                                    metricsToKeep.push(m);
                                }
                            });
                            parsedData.keyMetrics = metricsToKeep;
                            parsedData.kpiList = parsedData.kpiList.filter((v, i, a) => a.findIndex(t => t.name?.trim().toLowerCase() === v.name?.trim().toLowerCase()) === i);
                        }

                        if (parsedData.keyMetrics && parsedData.kpiList) {
                            const kpiNames = parsedData.kpiList.map(k => k.name?.trim().toLowerCase().replace(/tỷ lệ|tỉ lệ|học viên|nhân sự/g, '').trim());
                            parsedData.keyMetrics = parsedData.keyMetrics.filter(m => {
                                const mName = m.label?.trim().toLowerCase().replace(/tỷ lệ|tỉ lệ|học viên|nhân sự/g, '').trim();
                                if (!mName) return true;
                                return !kpiNames.some(kn => kn && (kn.includes(mName) || mName.includes(kn)));
                            });
                        }

                        if (parsedData.charts) {
                            parsedData.charts = parsedData.charts.filter(c => {
                                if (!c.dataPoints || c.dataPoints.length < 2) return false;
                                const titleLower = (c.title || "").toLowerCase();
                                if (titleLower.includes('tiến độ') || titleLower.includes('kpi')) return false;
                                const isGroupedKPI = c.dataPoints.every(dp => (dp.name || "").toLowerCase().includes('tỷ lệ'));
                                if (isGroupedKPI) return false;
                                return true;
                            });
                        }
                    }
                    
                    const now = new Date();
                    const year = now.getFullYear().toString();
                    let month = `Tháng ${String(now.getMonth() + 1).padStart(2, '0')}`;
                    let week = "Báo cáo chung";
                    
                    const periodStr = (parsedData.reportPeriod || "").toLowerCase();
                    const weekMatch = periodStr.match(/tuần\s*(\d{1,2})/);
                    if (weekMatch) week = `Tuần ${weekMatch[1]}`;
                    const monthMatch = periodStr.match(/tháng\s*(\d{1,2})/);
                    if (monthMatch) month = `Tháng ${monthMatch[1].padStart(2, '0')}`;

                    const newReport = {
                        id: Date.now().toString(),
                        fileName: file.name,
                        timestamp: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }),
                        createdAt: now.getTime(),
                        monthYear: `${month}/${year}`,
                        folderPath: { year, month, week },
                        data: parsedData
                    };

                    const updated = [newReport, ...reports].sort((a, b) => b.createdAt - a.createdAt);
                    updateAndSyncReports(updated);
                    setActiveReportId(newReport.id);

                    // Chuyển về màn hình Dashboard sau khi upload xong (Cho Mobile)
                    setIsMobileMenuOpen(false);

                } catch (error) {
                    console.error(error);
                    alert("Lỗi: " + error.message);
                } finally {
                    setIsProcessing(false);
                }
            };

            const activeReport = reports.find(r => r.id === activeReportId && r.fileName !== "_FOLDER_");

            const buildTree = (reportList) => {
                const tree = {};
                reportList.forEach(report => {
                    const { year, month, week } = getReportPath(report);

                    if (!tree[year]) tree[year] = {};
                    if (!tree[year][month]) tree[year][month] = {};
                    if (!tree[year][month][week]) tree[year][month][week] = [];

                    tree[year][month][week].push(report);
                });
                return tree;
            };

            const groupedTree = buildTree(reports);
            const sortedYears = Object.keys(groupedTree).sort((a, b) => b - a);

            const [expandedNodes, setExpandedNodes] = useState({});
            const toggleNode = (nodeId) => {
                setExpandedNodes(prev => ({ ...prev, [nodeId]: prev[nodeId] === false ? true : false }));
            };
            const isExpanded = (nodeId, defaultState = true) => {
                return expandedNodes[nodeId] === undefined ? defaultState : expandedNodes[nodeId];
            };

            return (
                <div className="flex flex-col h-screen bg-gray-200">
                    <Header syncStatus={syncStatus} onOpenSyncModal={() => setShowSyncModal(true)} role={role} setRole={setRole} onRefresh={() => fetchFromSheets(sheetsApiUrl)} onToggleMenu={() => setIsMobileMenuOpen(!isMobileMenuOpen)} />
                    
                    {showFolderModal && (
                        <FolderCreateModal onClose={() => setShowFolderModal(false)} onCreate={handleCreateFolder} />
                    )}

                    {showSyncModal && (
                        <SheetsConfigModal onClose={() => setShowSyncModal(false)} apiUrl={sheetsApiUrl} setApiUrl={saveApiUrl} onSync={fetchFromSheets} disabled={isProcessing} />
                    )}

                    {/* MODAL XÓA BÁO CÁO */}
                    {reportToDelete && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-beu-purple1/60 backdrop-blur-sm print-hidden">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden flex flex-col scale-100 transition-transform">
                                <div className="px-5 py-4 border-b bg-red-50 flex justify-between items-center">
                                    <h3 className="font-bold text-red-600 flex items-center gap-2"><i className="ph-fill ph-warning-circle text-xl"></i> Xác nhận xóa báo cáo</h3>
                                </div>
                                <div className="p-5">
                                    <p className="text-gray-700 text-sm mb-3">Bạn có chắc chắn muốn xóa báo cáo này khỏi hệ thống?</p>
                                    <p className="text-xs text-orange-600 bg-orange-50 p-2 rounded border border-orange-100">Hệ thống sẽ tự động đồng bộ và xóa file trên Google Sheets.</p>
                                    <div className="mt-6 flex justify-end gap-3">
                                        <button onClick={() => setReportToDelete(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm font-medium transition-colors">Hủy</button>
                                        <button onClick={confirmDeleteReport} className="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-bold transition-colors shadow-sm">Xóa báo cáo</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL XÓA THƯ MỤC */}
                    {folderToDelete && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-beu-purple1/60 backdrop-blur-sm print-hidden">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden flex flex-col scale-100 transition-transform">
                                <div className="px-5 py-4 border-b bg-red-50 flex justify-between items-center">
                                    <h3 className="font-bold text-red-600 flex items-center gap-2"><i className="ph-fill ph-warning-circle text-xl"></i> Xóa toàn bộ thư mục</h3>
                                </div>
                                <div className="p-5">
                                    <p className="text-gray-700 text-sm mb-3">Bạn đang chuẩn bị xóa thư mục <b>{folderToDelete.level === 'year' ? `Năm ${folderToDelete.year}` : folderToDelete.level === 'month' ? `${folderToDelete.month}` : folderToDelete.week}</b> và <b>TẤT CẢ</b> báo cáo bên trong.</p>
                                    <p className="text-xs text-orange-600 bg-orange-50 p-2 rounded border border-orange-100">Hành động này sẽ xóa sạch dữ liệu nhóm này khỏi máy tính và Đám mây.</p>
                                    <div className="mt-6 flex justify-end gap-3">
                                        <button onClick={() => setFolderToDelete(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm font-medium transition-colors">Hủy</button>
                                        <button onClick={confirmDeleteFolder} className="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-bold transition-colors shadow-sm">Xóa thư mục</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-1 overflow-hidden relative">
                        
                        {/* OVERLAY LÀM TỐI MÀN HÌNH CHÍNH KHI MỞ MENU TRÊN MOBILE */}
                        {isMobileMenuOpen && (
                            <div 
                                className="fixed inset-0 bg-beu-purple1/40 z-30 md:hidden backdrop-blur-sm transition-opacity"
                                onClick={() => setIsMobileMenuOpen(false)}
                            ></div>
                        )}

                        {/* CỘT TRÁI: SIDEBAR (TỰ ĐỘNG ĐÓNG/MỞ TRÊN MOBILE) */}
                        <div className={`w-[85vw] max-w-[340px] md:w-[380px] bg-white border-r border-gray-200 flex flex-col shrink-0 z-40 shadow-2xl md:shadow-lg print-hidden absolute md:relative h-full transition-transform duration-300 ease-in-out ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                            
                            {/* NÚT ĐÓNG MENU TRÊN MOBILE */}
                            <div className="md:hidden flex justify-between items-center p-3 border-b bg-gray-50">
                                <span className="font-bold text-beu-purple1"><i className="ph-fill ph-folders text-beu-teal1"></i> Quản lý Báo Cáo</span>
                                <button onClick={() => setIsMobileMenuOpen(false)} className="text-gray-500 hover:text-red-500 p-1"><i className="ph-bold ph-x text-xl"></i></button>
                            </div>

                            {/* CHỈ HIỂN THỊ Ô UPLOAD NẾU LÀ ADMIN */}
                            {isAdmin && (
                                <div className="p-4 border-b border-gray-100 bg-gray-50">
                                    <CompactUploadScreen onUpload={handleUpload} disabled={isProcessing} />
                                </div>
                            )}
                            
                            <div className="flex-1 overflow-y-auto p-4 bg-white relative flex flex-col">
                                {/* HEADER CÂY THƯ MỤC CÓ NÚT THÊM (+) */}
                                <div className="flex justify-between items-center mb-3 pb-2 border-b border-gray-100 sticky top-0 bg-white z-20">
                                    <span className="font-bold text-gray-400 text-[11px] uppercase tracking-widest flex items-center gap-1"><i className="ph-fill ph-tree-structure text-sm"></i> Cây Thư Mục</span>
                                    {isAdmin && (
                                        <button onClick={() => setShowFolderModal(true)} className="flex items-center gap-1 text-beu-teal1 bg-beu-teal2/20 hover:bg-beu-teal1 hover:text-white px-2 py-1 rounded text-[10px] font-bold transition-colors" title="Chủ động tạo cây thư mục">
                                            <i className="ph-bold ph-folder-plus"></i> + Tạo
                                        </button>
                                    )}
                                </div>

                                <div className="flex-1 space-y-2">
                                    {/* HIỆN TRẠNG THÁI LOADING KHI ĐANG TỰ ĐỘNG ĐỒNG BỘ MÀ CHƯA CÓ BÁO CÁO */}
                                    {reports.length === 0 && syncStatus === 'syncing' && (
                                        <div className="text-center p-6 rounded-xl text-beu-teal1 text-sm flex flex-col items-center mt-4">
                                            <i className="ph-fill ph-spinner animate-spin text-3xl mb-2"></i>
                                            Đang tải dữ liệu từ Google Sheets...
                                        </div>
                                    )}

                                    {reports.length === 0 && !isProcessing && syncStatus !== 'syncing' && (
                                        <div className="text-center p-6 border-2 border-dashed border-gray-200 rounded-xl text-gray-400 text-sm mt-4">
                                            {isAdmin ? (
                                                <>Database trống.<br/>Tạo thư mục hoặc Kéo thả file PDF để phân tích.</>
                                            ) : (
                                                <>Chưa có dữ liệu báo cáo.<br/>Vui lòng chờ hệ thống cập nhật.</>
                                            )}
                                        </div>
                                    )}

                                    {/* LỊCH SỬ BÁO CÁO - GIAO DIỆN CÂY THƯ MỤC */}
                                    {sortedYears.map(year => (
                                        <div key={`y-${year}`} className="mb-2">
                                            <div onClick={() => toggleNode(`y-${year}`)} className="group flex items-center justify-between font-bold text-beu-purple1 p-2 hover:bg-gray-100 rounded-lg cursor-pointer transition-colors select-none border border-transparent hover:border-gray-200">
                                                <div className="flex items-center gap-2">
                                                    <i className={`ph-bold ${isExpanded(`y-${year}`) ? 'ph-caret-down' : 'ph-caret-right'} text-gray-400`}></i>
                                                    <i className="ph-fill ph-folder-notch text-beu-teal3 text-xl"></i> Năm {year}
                                                </div>
                                                {isAdmin && (
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setFolderToDelete({ level: 'year', year });
                                                        }}
                                                        className="md:opacity-0 md:group-hover:opacity-100 text-gray-400 hover:text-red-500 hover:bg-red-50 p-1.5 rounded transition-colors"
                                                        title="Xóa toàn bộ thư mục Năm này"
                                                    >
                                                        <i className="ph-fill ph-trash"></i>
                                                    </button>
                                                )}
                                            </div>

                                            {isExpanded(`y-${year}`) && (
                                                <div className="pl-3 border-l-2 border-gray-100 ml-4 mt-1 space-y-1">
                                                    {Object.keys(groupedTree[year]).sort((a,b) => b.localeCompare(a)).map(month => (
                                                        <div key={`m-${year}-${month}`}>
                                                            <div onClick={() => toggleNode(`m-${year}-${month}`)} className="group flex items-center justify-between font-semibold text-gray-700 p-1.5 hover:bg-gray-50 rounded-lg cursor-pointer transition-colors select-none text-sm">
                                                                <div className="flex items-center gap-2">
                                                                    <i className={`ph-bold ${isExpanded(`m-${year}-${month}`) ? 'ph-caret-down' : 'ph-caret-right'} text-gray-400 text-xs`}></i>
                                                                    <i className="ph-fill ph-folder-open text-blue-400 text-lg"></i> {month}
                                                                </div>
                                                                {isAdmin && (
                                                                    <button 
                                                                        onClick={(e) => {
                                                                            e.stopPropagation();
                                                                            setFolderToDelete({ level: 'month', year, month });
                                                                        }}
                                                                        className="md:opacity-0 md:group-hover:opacity-100 text-gray-400 hover:text-red-500 hover:bg-red-50 p-1.5 rounded transition-colors"
                                                                        title="Xóa toàn bộ thư mục Tháng này"
                                                                    >
                                                                        <i className="ph-fill ph-trash"></i>
                                                                    </button>
                                                                )}
                                                            </div>

                                                            {isExpanded(`m-${year}-${month}`) && (
                                                                <div className="pl-4 border-l-2 border-gray-100 ml-3 mt-1.5 space-y-3 pb-2">
                                                                    {Object.keys(groupedTree[year][month]).sort((a,b) => a.localeCompare(b)).map(week => {
                                                                        const targetId = `w-${year}-${month}-${week}`;
                                                                        const realReports = groupedTree[year][month][week].filter(r => r.fileName !== '_FOLDER_');
                                                                        
                                                                        return (
                                                                        <div 
                                                                            key={targetId}
                                                                            className={`border-2 border-transparent transition-all rounded-lg ${dragOverTarget === targetId && isAdmin ? 'bg-beu-teal2/10 border-beu-teal1 border-dashed' : ''}`}
